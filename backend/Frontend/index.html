<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Home</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        .container { border: 1px solid #ccc; padding: 30px; border-radius: 8px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        input { padding: 8px; font-size: 16px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to Chess API Frontend</h1>
    <p>Enter your User ID and start a match.</p>

    <div>
        <label for="home-user-id">User ID:</label>
        <input type="text" id="home-user-id" value="player123">
    </div>

    <button id="start-game-btn">Find Match</button>
    <p id="home-message"></p>
</div>

<script src="index.js"></script>
</body>
</html>
